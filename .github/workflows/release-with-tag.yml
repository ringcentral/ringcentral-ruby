name: Release

on:
  push:
    tags:
      - "*"
permissions:
  contents: read

jobs:
  Test:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: |
          ruby <<'RUBY'
          required = %w[
            RINGCENTRAL_SERVER_URL RINGCENTRAL_CLIENT_ID RINGCENTRAL_CLIENT_SECRET
            RINGCENTRAL_JWT_TOKEN RINGCENTRAL_SENDER RINGCENTRAL_RECEIVER
          ]
          missing = required.select { |name| ENV[name].to_s.strip.empty? }
          abort "Missing required credentials: #{missing.join(', ')}" unless missing.empty?
          RUBY
          bundle exec rspec
        env:
          RINGCENTRAL_SERVER_URL: ${{ secrets.RINGCENTRAL_SERVER_URL }}
          RINGCENTRAL_CLIENT_ID: ${{ secrets.RINGCENTRAL_CLIENT_ID }}
          RINGCENTRAL_CLIENT_SECRET: ${{ secrets.RINGCENTRAL_CLIENT_SECRET }}
          RINGCENTRAL_JWT_TOKEN: ${{ secrets.RINGCENTRAL_JWT_TOKEN }}
          RINGCENTRAL_SENDER: ${{ secrets.RINGCENTRAL_SENDER }}
          RINGCENTRAL_RECEIVER: ${{ secrets.RINGCENTRAL_RECEIVER }}
      - name: View Report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-ruby-${{ matrix.ruby }}
          path: coverage/
          if-no-files-found: error
  Release:
    environment: prod
    needs: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: "4.0"
      - name: Install dependencies
        run: bundle install
      - name: Extract version from tag name
        id: extract_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Update gemspec file with version
        run: sed -i "s/gem.version\s*=\s*'.*'/gem.version = '${{ steps.extract_version.outputs.version }}'/" ringcentral-sdk.gemspec
      - name: Build gem
        run: |
          gem build ringcentral-sdk.gemspec
      - name: Publish gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem push ringcentral-sdk-${{ steps.extract_version.outputs.version }}.gem --host https://rubygems.org
