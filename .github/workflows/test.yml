name: Test

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: |
          ruby <<'RUBY'
          required = %w[
            RINGCENTRAL_SERVER_URL RINGCENTRAL_CLIENT_ID RINGCENTRAL_CLIENT_SECRET
            RINGCENTRAL_JWT_TOKEN RINGCENTRAL_SENDER RINGCENTRAL_RECEIVER
          ]
          missing = required.select { |name| ENV[name].to_s.strip.empty? }
          abort "Missing required credentials: #{missing.join(', ')}" unless missing.empty?
          RUBY
          bundle exec rspec
        env:
          RINGCENTRAL_SERVER_URL: ${{ secrets.RINGCENTRAL_SERVER_URL }}
          RINGCENTRAL_CLIENT_ID: ${{ secrets.RINGCENTRAL_CLIENT_ID }}
          RINGCENTRAL_CLIENT_SECRET: ${{ secrets.RINGCENTRAL_CLIENT_SECRET }}
          RINGCENTRAL_JWT_TOKEN: ${{ secrets.RINGCENTRAL_JWT_TOKEN }}
          RINGCENTRAL_SENDER: ${{ secrets.RINGCENTRAL_SENDER }}
          RINGCENTRAL_RECEIVER: ${{ secrets.RINGCENTRAL_RECEIVER }}
      - name: View Report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-ruby-${{ matrix.ruby }}
          path: coverage/
          if-no-files-found: error
