name: Publish Docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  Build:
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: "4.0"
      - name: Install dependencies
        run: bundle install
      - name: Install dependencies
        run: gem install yard

      - name: Generate Documentation
        run: yard doc

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc
